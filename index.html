  <h1>Voy a dormir</h1>
  <p>Alfonsina Storni</p>
  <p>
    Dientes de flores, cofia de rocío,<br>
    manos de hierbas, tú, nodriza fina,<br>
    tenme prestas las sábanas terrosas<br>
    y el edredón de musgos escardados.
  </p>
